---
---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://use.fontawesome.com; font-src 'self' https://use.fontawesome.com; img-src 'self' data: https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://www.googletagmanager.com https://analytics.google.com https://stats.g.doubleclick.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="google-site-verification" content="4u4Y1sSh6v3NCSOimIe3h1wSW3os9duYVUEquys8epE"/>
    <meta name="theme-color" content="#f6f8fc">
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic-base.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
    {% seo %}
  </head>
  <body class="computational">
    <a class="skip" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="identity" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/images/CalvinPortrait.jpg' | relative_url }}" alt="Calvin Wong" width="104" height="104">
          <span>{{ site.title }}</span>
        </a>
        <p class="identity-sub">Ming-Hei Wong<br>Mathematics · UT Knoxville</p>
        {% include navigation.html %}
        <div class="rail-contact">
          <p>PhD student<br>Expected graduation: 2027</p>
          <a href="mailto:{{ site.email }}">Email</a>
          <a href="https://github.com/{{ site.github }}">GitHub</a>
        </div>
      </header>
      <div class="main-column">
        <main id="main" class="{{ page.content_class | default: 'content-page' }}">
          {{ content }}
        </main>
        {% include academic-footer.html %}
      </div>
    </div>
    {% include google-analytics.html %}
  </body>
</html>
